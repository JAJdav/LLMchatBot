<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AML Chatbot Workspace</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="workflow.js" defer></script>

</head>
<body class="min-h-screen bg-slate-50 text-slate-800 flex flex-col items-center antialiased relative">

    <!-- Navbar / Back to Dashboard -->
    <header class="w-full max-w-2xl px-4 pt-6 flex justify-between items-center">
        <a href="index.html" class="inline-flex items-center gap-2 text-xs font-semibold text-slate-500 hover:text-slate-800 transition">
            <i data-lucide="arrow-left" class="w-4 h-4"></i> Back to Cases
        </a>
        <span id="activeCaseBadge" class="bg-slate-200 text-slate-700 text-xs font-mono font-bold px-2.5 py-1 rounded-md">
            No Case Selected
        </span>
    </header>

    <!-- Hero / Welcome Section -->
    <main id="heroSection" class="flex-1 flex flex-col items-center justify-center px-4 pb-28 text-center max-w-md w-full transition-all duration-300 my-auto">
        <img class="w-20 h-20 object-contain mb-5 drop-shadow-sm" src="ai.png" alt="AI chatbot">
        <h1 class="text-3xl font-extrabold tracking-tight text-slate-900">AML Chatbot</h1>
        <p class="mt-2 text-slate-500 text-sm font-medium">Ask questions or request a case summary</p>
    </main>

    <!-- Dynamic Messages Container -->
    <div id="chatContainer" class="hidden w-full max-w-2xl px-4 pb-36 pt-6 flex-1 flex-col gap-4"></div>

    <!-- Floating Input Form -->
    <div class="fixed bottom-0 left-0 right-0 p-4 sm:p-6 bg-gradient-to-t from-slate-50 via-slate-50/90 to-transparent">
        <form id="chatForm" class="max-w-2xl mx-auto flex items-center gap-2 bg-white border border-slate-200/80 rounded-2xl shadow-lg shadow-slate-200/50 p-2 transition-all focus-within:border-emerald-500 focus-within:ring-4 focus-within:ring-emerald-500/10">

            <input
                id="userInput"
                type="text"
                placeholder="Type your question..."
                autocomplete="off"
                class="flex-1 px-4 py-3 text-slate-800 placeholder-slate-400 bg-transparent text-base outline-none border-none"
            >

            <button
                type="submit"
                aria-label="Send message"
                class="inline-flex items-center justify-center p-3.5 bg-emerald-500 hover:bg-emerald-600 active:scale-95 text-white rounded-xl shadow-md shadow-emerald-500/20 transition-all duration-150 ease-in-out cursor-pointer"
            >
                <i data-lucide="send-horizontal" class="w-5 h-5"></i>
            </button>
        </form>
    </div>

</body>
</html>
